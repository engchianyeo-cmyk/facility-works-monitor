name: Release-1 Verification

on:
  push:
    branches:
      - reconciliation/release1-incremental-repair
      - codex/continue-release-1-defect-family-review
      - codex/preview-schema-reconciliation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release1-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview-reconciliation:
    name: Native populated Preview reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: fmworks_preview_reconcile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d fmworks_preview_reconcile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGPASSWORD: disposable-test-only
      TEST_DATABASE: fmworks_preview_reconcile_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify populated Preview adapter, rollback and security
        shell: bash
        run: |
          set -o pipefail
          TEST_WORKSPACE="$GITHUB_WORKSPACE" sh tests/sql/run_release1_preview_reconciliation.sh 2>&1 | tee preview-reconciliation-native.log
      - name: Upload native reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: preview-reconciliation-native.log

  release-verify:
    name: Isolated Docker Release Verification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Release-1 repair branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Confirm Docker availability
        run: |
          docker version
          docker info

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete Release-1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run release:verify 2>&1 | tee release-verify.log

      - name: Capture Docker state
        if: always()
        run: |
          docker ps -a > docker-ps.txt || true
          npx supabase status > supabase-status.txt 2>&1 || true

      - name: Upload Release-1 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release1-verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            release-verify.log
            docker-ps.txt
            supabase-status.txt
            playwright-report/
            test-results/
